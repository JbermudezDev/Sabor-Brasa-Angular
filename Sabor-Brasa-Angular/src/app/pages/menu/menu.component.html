<main class="menu-dashboard-full">

  <!-- CATEGORÍAS -->
  <div class="menu-categorias">
  <h3 class="categoria-titulo">Categorías</h3>
  <div class="categoria-grid">
    <div class="categoria-card" [ngClass]="{ 'activa': categoriaSeleccionada === 'todo' }" (click)="filtrarCategoria('todo')">
      <span class="emoji">📋</span>
      <span>Todo</span>
    </div>
    <div class="categoria-card" [ngClass]="{ 'activa': categoriaSeleccionada === 'entradas' }" (click)="filtrarCategoria('entradas')">
      <span class="emoji">🥟</span>
      <span>Entradas</span>
    </div>
    
    <div class="categoria-card" [ngClass]="{ 'activa': categoriaSeleccionada === 'platosFuertes' }" (click)="filtrarCategoria('platosFuertes')">
      <span class="emoji">🍖</span>
      <span>Platos Fuertes</span>
    </div>
    <div class="categoria-card" [ngClass]="{ 'activa': categoriaSeleccionada === 'bebidas' }" (click)="filtrarCategoria('bebidas')">
      <span class="emoji">🥤</span>
      <span>Bebidas</span>
    </div>
    
    <div class="categoria-card" [ngClass]="{ 'activa': categoriaSeleccionada === 'postres' }" (click)="filtrarCategoria('postres')">
      <span class="emoji">🍰</span>
      <span>Postres</span>
    </div>
  </div>
</div>

  
  
  <!-- PRODUCTOS -->
  <div class="menu-productos">
    <input type="text" placeholder="🔍 Buscar un producto..." class="search-bar" [(ngModel)]="busqueda" (input)="filtrarProductos()" />
    <div class="grid">
      <div class="card" *ngFor="let producto of productosFiltrados" (click)="irAInfoPlato(producto.id)">
        <div class="content">
          <div class="back">
            <div class="back-content">
              <img [src]="'http://localhost:8090' + producto.imagen" alt="Imagen del producto" class="product-image" />
            </div>
          </div>
          <div class="front">
            <div class="img">
              <div class="circle"></div>
              <div class="circle" id="right"></div>
              <div class="circle" id="bottom"></div>
            </div>
            <div class="front-content">
              <small class="badge">{{ producto.descripcion }}</small>
              <div class="description">
                <div class="title">
                  <p class="title">{{ producto.nombre }}</p>
                  <svg height="15px" width="15px" viewBox="0,0,256,256" xmlns="http://www.w3.org/2000/svg">
                    <g transform="scale(8,8)">
                      <path d="M25,27l-9,-6.75l-9,6.75v-23h18z" fill="#20c997"></path>
                    </g>
                  </svg>
                </div>
                <p class="card-footer">Precio: {{ producto.precio | currency:'COP' }}</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- CARRITO -->
  <div class="menu-carrito">
    <h2>🛒 Carrito de Compras</h2>
    <button class="btn-volver" (click)="volverAlPerfil()">
      🔙 Volver al perfil
    </button>
    <app-carrito-icon></app-carrito-icon>
  </div>

</main>

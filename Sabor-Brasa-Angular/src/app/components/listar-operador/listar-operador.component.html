<div class="dashboard">
  <!-- Sidebar Operador -->
  <aside class="sidebar">
    <div class="profile">
      <img src="assets/images/administrador.png" alt="Foto Operador" class="profile-img" />
      <h2>Operador</h2>
    </div>

    <nav class="nav">
      <a routerLink="/perfil" class="nav-link"><i class="ri-profile-line"></i> Mi Perfil</a>
      <a routerLink="/" class="nav-link logout"><i class="ri-logout-box-r-line"></i> Log Out</a>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <main class="dashboard-content">
    <!-- Título principal -->
    <div class="dashboard-header pedidos-header enhanced-title">
      <div>
        <h1 class="dashboard-title">📦 GESTIÓN DE PEDIDOS</h1>
        <p class="dashboard-subtitle">Administra el estado y la asignación de pedidos en tiempo real</p>
      </div>
    </div>

    <!-- Filtros -->
    <div class="filters-bar">
      <input type="text" class="filter-input" [(ngModel)]="filtroCliente" placeholder="Filtrar por cliente" />
      <select class="filter-select" [(ngModel)]="filtroEstado">
        <option value="">Todos los estados</option>
        <option *ngFor="let est of estados" [value]="est">{{ est }}</option>
      </select>
    </div>

    <!-- Tabla de Pedidos -->
    <div class="table-box enhanced-shadow">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Estado</th>
            <th>Domiciliario</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let pedido of pedidosFiltrados">
            <td>{{ pedido.id }}</td>
            <td>{{ pedido.cliente.nombre }} {{ pedido.cliente.apellido }}</td>
           <td>
  <select class="select-estado colored" [(ngModel)]="pedido.estado" [ngClass]="pedido.estado.toLowerCase()">
    <option *ngFor="let est of estados" [value]="est">
      {{ getEstadoConEmoji(est) }}
    </option>
  </select>
</td>


            <td>
              <select class="select-domiciliario" [(ngModel)]="pedido.domiciliario">
                <option [ngValue]="null">Sin asignar</option>
                <option *ngFor="let dom of domiciliarios" [ngValue]="dom">
                  {{ dom.nombre }}
                </option>
              </select>
            </td>
            <td>
              <button class="btn-actualizar" (click)="actualizarPedido(pedido)">
                <i class="ri-check-line"></i> Actualizar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

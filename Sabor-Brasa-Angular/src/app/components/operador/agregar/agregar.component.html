<div class="container">
  <!-- Sidebar moderno -->
  <aside class="sidebar">
    <div class="profile">
      <img src="assets/images/administrador.png" alt="Foto" class="profile-img" />
      <h2>Juan Jose Bermudez</h2>
    </div>

    <nav class="nav">
      <a routerLink="/administrador" class="nav-link"><i class="ri-vip-crown-fill"></i> Administrador</a>
      <a routerLink="/adicionales" class="nav-link"><i class="ri-goblet-2-fill"></i> Adicionales</a>
      <a routerLink="/productos" class="nav-link"><i class="ri-restaurant-fill"></i> Productos</a>
      <a routerLink="/clientes" class="nav-link"><i class="ri-user-fill"></i> Clientes</a>
      <a routerLink="/operadores" class="nav-link active"><i class="ri-user-settings-fill"></i> Operadores</a>
      <a routerLink="/" class="nav-link logout"><i class="ri-logout-box-line"></i> Log Out</a>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <main class="main-content">
    <h1>Agregar Operador</h1>

    <div class="card-client">
      <form (ngSubmit)="onSubmit()" #operadorForm="ngForm" class="formulario-editar">
        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            [(ngModel)]="operador.nombre"
            required
          />
        </div>

        <div class="form-group">
          <label for="usuario">Usuario:</label>
          <input
            type="text"
            id="usuario"
            name="usuario"
            [(ngModel)]="operador.usuario"
            required
          />
        </div>

        <div class="form-group wide">
          <label for="contrasena">Contraseña:</label>
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            [(ngModel)]="operador.contrasena"
            required
          />
        </div>

        <div class="card-actions">
          <a routerLink="/operadores" class="btn-action back">
            <i class="ri-arrow-left-line"></i> Cancelar
          </a>
          <button type="submit" class="btn-action edit" [disabled]="!operadorForm.valid">
            <i class="ri-check-line"></i> Agregar Operador
          </button>
        </div>
      </form>
    </div>
  </main>
</div>

<div class="container">
  <!-- Sidebar -->
   <aside class="sidebar">
    <div class="profile">
      <img src="assets/images/administrador.png" alt="Foto" class="profile-img" />
      <h2>Juan Jose Bermudez</h2>
    </div>

    <nav class="nav">
      <a routerLink="/administrador" class="nav-link "><i class="ri-pie-chart-2-fill"></i> Dashboard</a>
      <a routerLink="/operadores" class="nav-link"><i class="ri-walk-line"></i> Operadores</a> 
      <a routerLink="/productos" class="nav-link"><i class="ri-restaurant-fill"></i> Productos</a>
      <a routerLink="/adicionales" class="nav-link active"><i class="ri-goblet-2-fill"></i> Adicionales</a>
      <a routerLink="/clientes" class="nav-link"><i class="ri-user-fill"></i> Clientes</a>
      <a routerLink="/" class="nav-link logout"><i class="ri-logout-box-line"></i> Log Out</a>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <main class="main-content">
    <h1>Detalles del Adicional</h1>

    <div class="card-client">
      <div class="card-header">
        <i class="ri-restaurant-line"></i>

        <h2>{{ adicional?.nombre }}</h2>
        <p>Información registrada del adicional en el sistema</p>
      </div>

      <div class="card-body">
        <div class="info-pair wide">
          <i class="ri-restaurant-line"></i>
          <div>
            <label>Nombre</label>
            <span>{{ adicional?.nombre }}</span>
          </div>
        </div>

        <div class="info-pair wide">
          <i class="ri-money-dollar-circle-line"></i>
          <div>
            <label>Precio</label>
            <span>{{ adicional?.precio | number:'1.3-3' }}</span>
          </div>
        </div>

        <div class="info-pair wide">
          <i class="ri-file-text-line"></i>
          <div>
            <label>Descripción</label>
            <span>{{ adicional?.descripcion }}</span>
          </div>
        </div>
      </div>

      <div class="card-actions">
        <a routerLink="/adicionales" class="btn-action back">
          <i class="ri-arrow-left-line"></i> Volver
        </a>
        <a [routerLink]="['/adicionales/editar', adicional?.id]" class="btn-action edit">
          <i class="ri-edit-line"></i> Editar
        </a>
      </div>
    </div>
  </main>
</div>

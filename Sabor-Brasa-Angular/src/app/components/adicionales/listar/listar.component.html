<div class="container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile">
      <img src="assets/images/administrador.png" alt="Foto" class="profile-img" />
      <h2>Juan Jose Bermudez</h2>
    </div>

    <nav class="nav">
      <a routerLink="/administrador" class="nav-link"><i class="ri-user-line"></i>Administrador</a>
      <a routerLink="/operadores" class="nav-link"><i class="ri-walk-line"></i> Operadores</a> 
      <a routerLink="/productos" class="nav-link"><i class="ri-restaurant-fill"></i> Productos</a>
      <a routerLink="/adicionales" class="nav-link active"><i class="ri-goblet-2-fill"></i> Adicionales</a>
      <a routerLink="/clientes" class="nav-link"><i class="ri-user-fill"></i> Clientes</a>
      <a routerLink="/" class="nav-link logout"><i class="ri-logout-box-line"></i> Log Out</a>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <main class="main-content">
    <h1>Listado de Adicionales</h1>

    <!-- Buscar adicionales -->
    <div class="search-container">
      <input
        type="text"
        id="search-input"
        placeholder="Buscar adicionales..."
        [(ngModel)]="searchTerm"
        (keyup)="buscarAdicionales()"
      />
      <i class="fas fa-search"></i>
    </div>

    <!-- Botón para agregar adicional -->
    <div class="button-submit">
      <button routerLink="/adicionales/agregar" class="btn-submit">
        Agregar Adicional
      </button>
    </div>

    <!-- Tabla de adicionales -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Descripción</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let adicional of filteredAdicionales; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ adicional.nombre }}</td>
            <td>{{ adicional.precio | currency:'COP' }}</td>
            <td>{{ adicional.descripcion }}</td>
            <td>
              <div class="btn-container">
                <!-- Botón Ver -->
                <button class="btn yellow" [routerLink]="['/adicionales/detalle', adicional.id]">
                  <i class="fas fa-eye"></i>
                </button>
                <!-- Botón Editar -->
                <button class="btn green" [routerLink]="['/adicionales/editar', adicional.id]">
                  <i class="fas fa-edit"></i>
                </button>
                <!-- Botón Eliminar -->
                <button class="btn red" (click)="deleteAdicional(adicional.id)">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div class="container">
  <aside class="sidebar">
    <div class="profile">
      <img src="assets/images/administrador.png" alt="Foto" class="profile-img" />
      <h2>Juan Jose Bermudez</h2>
    </div>

    <nav class="nav">
      <a routerLink="/administrador" class="nav-link"><i class="ri-user-line"></i>Administrador</a>
      <a routerLink="/operadores" class="nav-link"><i class="ri-walk-line"></i> Operadores</a>
      
      <a routerLink="/productos" class="nav-link active"><i class="ri-restaurant-fill"></i> Productos</a>
      <a routerLink="/adicionales" class="nav-link"><i class="ri-goblet-2-fill"></i> Adicionales</a>
      <a routerLink="/clientes" class="nav-link "><i class="ri-user-fill"></i> Clientes</a>
    
      <a routerLink="/" class="nav-link logout"><i class="ri-logout-box-line"></i> Log Out</a>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <main class="main-content">
    <h1>Listado de Productos</h1>

    <!-- Buscar productos -->
    <div class="search-container">
      <input
        type="text"
        id="search-input"
        placeholder="Buscar productos..."
        [(ngModel)]="searchTerm"
        (keyup)="buscarProductos()"
      />
      <i class="fas fa-search"></i>
    </div>

    <!-- Botón para agregar producto -->
    <div class="button-submit">
      <button class="btn-submit" routerLink="/productos/agregar">
        Agregar Producto
      </button>
    </div>

    <!-- Tabla de productos -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Descripción</th>
            <th>Imagen</th>
            <th>Adicionales</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let producto of filteredProductos">
            <td>{{ producto.id }}</td>
            <td>{{ producto.nombre }}</td>
            <td>{{ producto.precio | currency: 'COP' }}</td>
            <td>{{ producto.descripcion }}</td>
            <td>
              <img [src]="'http://localhost:8090' + producto.imagen" alt="Imagen del producto" width="50" />
            </td>
            <td>
              <ul>
                <li *ngFor="let adicional of producto.adicionales">
                  {{ adicional.nombre }}
                </li>
              </ul>
            </td>
            <td>
              <div class="btn-container">
                <button class="btn yellow" [routerLink]="['/productos/detalle', producto.id]">
                  <i class="fi fi-sr-eye"></i>
                </button>
                <button class="btn green" [routerLink]="['/productos/editar', producto.id]">
                  <i class="fas fa-edit"></i>
                </button>
                <button class="btn red" (click)="deleteProducto(producto.id)">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div class="container">
  <!-- Sidebar -->
 <aside class="sidebar">
    <div class="profile">
      <img src="assets/images/administrador.png" alt="Foto" class="profile-img" />
      <h2>Juan Jose Bermudez</h2>
    </div>

    <nav class="nav">
      <a routerLink="/administrador" class="nav-link "><i class="ri-pie-chart-2-fill"></i> Dashboard</a>
      <a routerLink="/operadores" class="nav-link"><i class="ri-walk-line"></i> Operadores</a> 
      <a routerLink="/productos" class="nav-link active"><i class="ri-restaurant-fill"></i> Productos</a>
      <a routerLink="/adicionales" class="nav-link"><i class="ri-goblet-2-fill"></i> Adicionales</a>
      <a routerLink="/clientes" class="nav-link"><i class="ri-user-fill"></i> Clientes</a>
      <a routerLink="/" class="nav-link logout"><i class="ri-logout-box-line"></i> Log Out</a>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <main class="main-content">
    <h1>Editar Producto</h1>

    <div class="card-client">
      <form (ngSubmit)="onSubmit()" #productoForm="ngForm" class="formulario-editar">
        <input type="hidden" name="id" [(ngModel)]="producto.id" />

        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" [(ngModel)]="producto.nombre" required />
        </div>

        <div class="form-group">
          <label for="precio">Precio:</label>
          <input type="number" id="precio" name="precio" [(ngModel)]="producto.precio" step="0.01" required />
        </div>

        <div class="form-group wide">
          <label for="descripcion">Descripción:</label>
          <input type="text" id="descripcion" name="descripcion" [(ngModel)]="producto.descripcion" required />
        </div>

        <div class="form-group wide">
          <label for="imagen">URL de Imagen:</label>
          <input type="text" id="imagen" name="imagen" [(ngModel)]="producto.imagen" required />
        </div>

        <div class="form-group wide">
          <label for="adicionales">Adicionales:</label>
          <div class="checkbox-group">
            <label *ngFor="let adicional of adicionales">
              <input
                type="checkbox"
                [checked]="isAdicionalSelected(adicional)"
                (change)="toggleAdicional(adicional)"
              />
              {{ adicional.nombre }}
            </label>
          </div>
        </div>

        <div class="card-actions">
          <a routerLink="/productos" class="btn-action back">
            <i class="ri-arrow-left-line"></i> Cancelar
          </a>
          <button type="submit" class="btn-action edit" [disabled]="!productoForm.valid">
            <i class="ri-check-line"></i> Actualizar Producto
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
